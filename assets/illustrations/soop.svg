<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" width="220" height="150" role="img">
<defs></defs>
<style>
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.12) rotate(2deg)}}
.stream{animation:str 1s linear infinite}@keyframes str{to{stroke-dashoffset:-18}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sw 5s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wave{animation:wv 7s ease-in-out infinite alternate}@keyframes wv{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.wave2{animation:wv 9s ease-in-out infinite alternate-reverse}
.glow{transform-box:fill-box;transform-origin:center;animation:gl 6s ease-in-out infinite}@keyframes gl{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.08);opacity:.8}}
.rise{animation:ri 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes ri{from{transform:translateY(70px)}to{transform:none}}
.bird{animation:bd 14s linear infinite}@keyframes bd{from{transform:translateX(-120px)}to{transform:translateX(1320px)}}
.wing{transform-box:fill-box;transform-origin:50% 50%;animation:wg .7s ease-in-out infinite alternate}@keyframes wg{to{transform:scaleY(.5)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
