<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460" role="img" class="s-root" >
<defs>
<pattern id="p-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="1.7" fill="#E3B25A" opacity=".75"/></pattern>
<pattern id="p-motif" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M8 2 l3 6 l-3 6 l-3 -6z" fill="#E3B25A" opacity=".8"/></pattern>
<pattern id="p-check" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 0h5v5H0zM5 5h5v5H5z" fill="#ffffff" opacity=".13"/></pattern>
