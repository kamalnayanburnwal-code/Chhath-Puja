<style>
.s-flame{transform-box:fill-box;transform-origin:50% 100%;animation:s-fl 1.6s ease-in-out infinite}
@keyframes s-fl{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.12) rotate(2deg)}}
.s-stream{animation:s-str 1s linear infinite}@keyframes s-str{to{stroke-dashoffset:-18}}
.s-sway{transform-box:fill-box;transform-origin:50% 100%;animation:s-sw 5s ease-in-out infinite}
@keyframes s-sw{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.s-bob{animation:s-bob 4s ease-in-out infinite}@keyframes s-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.s-wave{animation:s-wv 7s ease-in-out infinite alternate}@keyframes s-wv{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.s-wave2{animation:s-wv 9s ease-in-out infinite alternate-reverse}
.s-glow{transform-box:fill-box;transform-origin:center;animation:s-gl 6s ease-in-out infinite}@keyframes s-gl{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.08);opacity:.8}}
.s-bird{animation:s-bd 16s linear infinite}@keyframes s-bd{from{transform:translateX(-140px)}to{transform:translateX(1400px)}}
.s-wing{transform-box:fill-box;transform-origin:50% 50%;animation:s-wg .7s ease-in-out infinite alternate}@keyframes s-wg{to{transform:scaleY(.5)}}
.s-legA,.s-legB{transform-box:fill-box;transform-origin:50% 0}
@media (prefers-reduced-motion:reduce){.s-root,.s-root *{animation:none!important}}
</style>
